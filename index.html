<!doctype html>
<html lang="ko">
<head>

<body>

      <div id="branch-list" class="branch-list"></div>

      <footer class="footer"><img src="assets/logo.png" alt="EXTAY" width="2088" height="296"><p>익스테이 · 지점 안내</p><span>© EXTAY. All rights reserved.</span></footer>
